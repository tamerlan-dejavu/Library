<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="register">

<div id="siteHeader"></div>

<main class="container flex-grow-1">

  <section class="pt-4 pb-3">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="row g-0">

            <div class="col-md-4 brand-panel p-4 d-flex flex-column justify-content-center">
              <img src="assets/logo.png" alt="" height="48" width="48" class="mb-3 align-self-start">
              <h2 class="h3">Join our library</h2>
              <p class="mb-3">Create an account to borrow books, leave reviews and keep your profile in one place.</p>
              <ul class="list-unstyled mb-0 small">
                <li class="mb-2">&#10003; Borrow books online</li>
                <li class="mb-2">&#10003; Write your own reviews</li>
                <li class="mb-2">&#10003; Your loans and reviews in one profile</li>
              </ul>
            </div>

            <div class="col-md-8">
              <form id="registerForm" class="p-4" novalidate>
                <h1 class="h3 mb-3">Create account</h1>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">First name</label>
                    <input type="text" id="firstName" class="form-control" autocomplete="given-name" aria-describedby="firstNameError">
                    <div id="firstNameError" class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Last name</label>
                    <input type="text" id="lastName" class="form-control" autocomplete="family-name" aria-describedby="lastNameError">
                    <div id="lastNameError" class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email" aria-describedby="emailError">
                  <div id="emailError" class="invalid-feedback"></div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="new-password" aria-describedby="passwordError">
                    <div id="passwordError" class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="password2" class="form-label">Repeat password</label>
                    <input type="password" id="password2" class="form-control" autocomplete="new-password" aria-describedby="password2Error">
                    <div id="password2Error" class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="birthYear" class="form-label">Birth year</label>
                    <input type="number" id="birthYear" class="form-control" placeholder="For example, 2000" aria-describedby="birthYearError">
                    <div id="birthYearError" class="invalid-feedback"></div>
                  </div>
                </div>

                <div id="formError" class="alert alert-danger d-none" role="alert"></div>

                <button type="submit" class="btn btn-danger px-4">Create account</button>
                <p class="mt-3 mb-0">Already have an account? <a href="login.html" class="text-danger">Sign in</a></p>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/register.js"></script>
</body>
</html>
