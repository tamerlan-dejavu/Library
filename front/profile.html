<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="profile">

<div id="siteHeader"></div>

<main class="container flex-grow-1">

  <div id="profileArea" class="d-none">
    <article class="pt-4">
      <div class="row g-4">
        <div class="col-md-auto">
          <div class="position-relative d-inline-block">
            <img src="assets/profile-placeholder.svg" alt="Profile icon" class="d-block object-fit-cover border border-2 border-danger bg-secondary-subtle profile-picture" width="220" height="300">
            <span class="badge bg-dark position-absolute bottom-0 end-0 m-2">Adult reader (18+)</span>
          </div>
        </div>

        <div class="col-md">
          <h1 id="profileName"></h1>
          <form id="profileForm" novalidate>
            <!-- Shown only in edit mode -->
            <div id="nameEdit" class="row g-3 mb-3 d-none">
              <div class="col-sm-6">
                <label for="firstName" class="form-label mb-1">First name</label>
                <input type="text" id="firstName" class="form-control" autocomplete="given-name" aria-describedby="firstNameError">
                <div id="firstNameError" class="invalid-feedback"></div>
              </div>
              <div class="col-sm-6">
                <label for="lastName" class="form-label mb-1">Last name</label>
                <input type="text" id="lastName" class="form-control" autocomplete="family-name" aria-describedby="lastNameError">
                <div id="lastNameError" class="invalid-feedback"></div>
              </div>
            </div>

            <span id="emailLabel" class="form-label d-block mb-1">Email-address</span>
            <p id="profileEmail" class="bg-secondary-subtle p-2 mb-3" aria-labelledby="emailLabel"></p>

            <span id="phoneLabel" class="form-label d-block mb-1">Phone number</span>
            <div id="phoneList" class="mb-3" aria-labelledby="phoneLabel"></div>
            <div id="phoneEdit" class="mb-3 d-none">
              <div id="phoneRows"></div>
              <button type="button" id="addPhone" class="btn btn-outline-danger btn-sm">Add phone</button>
              <div id="phonesError" class="invalid-feedback d-block" role="alert"></div>
            </div>

            <fieldset class="mb-2">
              <legend class="fs-6 mb-1">Birth year</legend>
              <p id="profileBirthYear" class="d-inline-block bg-secondary-subtle px-3 py-2 mb-0"></p>
            </fieldset>

            <div id="profileError" class="alert alert-danger mt-3 d-none" role="alert"></div>
            <div id="profileSuccess" class="alert alert-success mt-3 d-none" role="status"></div>

            <button type="button" id="editButton" class="btn btn-danger mt-2">Change profile</button>
            <span id="editButtons" class="d-none">
              <button type="submit" class="btn btn-danger mt-2">Save</button>
              <button type="button" id="cancelButton" class="btn btn-outline-secondary mt-2 ms-2">Cancel</button>
            </span>
          </form>
        </div>
      </div>
    </article>

    <section class="py-4" aria-labelledby="myBooksTitle">
      <h2 id="myBooksTitle" class="mb-3">My books</h2>
      <p id="noBooks" class="d-none">You have not borrowed any books yet. <a href="catalog.html" class="text-danger">Find one in the catalog.</a></p>
      <div id="bookRows" class="row g-3"></div>
    </section>

    <section class="py-4" aria-labelledby="myReviewsTitle">
      <h2 id="myReviewsTitle" class="mb-3">My reviews</h2>
      <p id="noReviews" class="d-none">You have not written any reviews yet. <a href="catalog.html" class="text-danger">Find a book to review.</a></p>
      <div id="myReviewList" class="row g-3"></div>
    </section>
  </div>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/books.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
