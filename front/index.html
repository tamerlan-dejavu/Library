<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="home">

<div id="siteHeader"></div>

<main class="container flex-grow-1">

  <section class="text-center pt-4 pb-3">
    <h1>Your Next Great Read Is Waiting</h1>
    <p>Borrow thousands of books from every genre - fiction, non-fiction, biographies and more - all in one place, ready whenever you are.</p>
    <a href="catalog.html" class="btn btn-danger px-4 py-2">Start Borrow</a>
  </section>

  <section class="pb-4" aria-labelledby="bestsellersTitle">
    <h2 id="bestsellersTitle" class="mb-3">Bestsellers</h2>
    <div id="bestsellers" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-4">
      <p class="col">Loading...</p>
    </div>
  </section>

  <section class="py-4" aria-labelledby="categoriesTitle">
    <h2 id="categoriesTitle" class="mb-3">Categories</h2>
    <nav id="categories" class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3" aria-label="Genres">
      <p class="col">Loading...</p>
    </nav>
  </section>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/books.js"></script>
<script src="js/index.js"></script>
</body>
</html>
