<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="catalog">

<div id="siteHeader"></div>

<nav class="bg-secondary-subtle border-bottom" aria-label="Section navigation">
  <div class="container-fluid px-4 py-2 d-flex flex-wrap gap-3">
    <a href="#description" class="fw-bold text-danger text-decoration-none">Description</a>
    <a href="#reviews" class="fw-bold text-danger text-decoration-none">Reviews</a>
    <a href="#write-review" class="fw-bold text-danger text-decoration-none">Write your Review</a>
  </div>
</nav>

<main class="container flex-grow-1">

  <div id="notFound" class="alert alert-secondary mt-4 d-none" role="alert"></div>

  <div id="bookArea">
    <article class="pt-4">
      <div class="row g-4">
        <div class="col-md-auto" id="coverBox"></div>
        <div class="col-md">
          <h1 id="bookTitle" class="mb-1">Loading...</h1>
          <p id="bookAuthors" class="mb-3"></p>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="bg-secondary-subtle px-3 py-1">Genre: <span id="bookGenre"></span></span>
            <span class="bg-secondary-subtle px-3 py-1">Rating: <span id="bookRating"></span></span>
          </div>

          <section id="description">
            <h2 class="mb-2">Description</h2>
            <p id="bookDescription"></p>
          </section>

          <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
            <div id="borrowBox"></div>
            <span id="copiesInfo"></span>
          </div>

          <section aria-labelledby="olTitle" class="mt-4">
            <h2 id="olTitle" class="mb-2">From Open Library</h2>
            <p id="olStatus" class="mb-0">
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading data from Open Library...
            </p>
            <div id="olData" class="d-none">
              <dl id="olFacts" class="row mb-2"></dl>
              <div id="olSubjects" class="d-flex flex-wrap gap-2 mb-3"></div>
              <a id="olLink" href="https://openlibrary.org" class="text-danger" rel="noopener">View on Open Library</a>
            </div>
          </section>
        </div>
      </div>
    </article>

    <section id="reviews" class="py-4">
      <h2 class="mb-3">Reviews</h2>
      <div id="reviewList"></div>
    </section>

    <section id="write-review" class="pb-4">
      <h2 class="mb-3">Write your Review</h2>

      <p id="signInToReview" class="d-inline-block bg-secondary-subtle px-3 py-2 mb-3 d-none">
        <a href="login.html" class="text-danger text-decoration-none">Sign in to leave a review</a>
      </p>

      <form id="reviewForm" class="d-none" novalidate>
        <fieldset class="mb-3">
          <legend class="fs-6">Select rating</legend>
          <div class="d-flex flex-wrap gap-2" role="radiogroup" aria-label="Select rating">
            <label class="bg-secondary-subtle px-3 py-2 rating-option"><input class="form-check-input me-1" type="radio" name="rating" value="1"> 1</label>
            <label class="bg-secondary-subtle px-3 py-2 rating-option"><input class="form-check-input me-1" type="radio" name="rating" value="2"> 2</label>
            <label class="bg-secondary-subtle px-3 py-2 rating-option"><input class="form-check-input me-1" type="radio" name="rating" value="3"> 3</label>
            <label class="bg-secondary-subtle px-3 py-2 rating-option"><input class="form-check-input me-1" type="radio" name="rating" value="4"> 4</label>
            <label class="bg-secondary-subtle px-3 py-2 rating-option"><input class="form-check-input me-1" type="radio" name="rating" value="5"> 5</label>
          </div>
        </fieldset>

        <label for="comment" class="form-label">Your review</label>
        <textarea id="comment" name="comment" placeholder="type your review..." class="form-control bg-secondary-subtle mb-3" rows="4"></textarea>

        <button type="submit" class="btn btn-danger">Submit</button>
        <div id="reviewError" class="alert alert-danger d-none mt-3" role="alert"></div>
        <div id="reviewSuccess" class="alert alert-success d-none mt-3" role="status"></div>
      </form>
    </section>
  </div>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/books.js"></script>
<script src="js/book.js"></script>
<script src="js/openlibrary.js"></script>
</body>
</html>
