<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="login">

<div id="siteHeader"></div>

<main class="container flex-grow-1">

  <section class="pt-4 pb-3">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="row g-0">

            <div class="col-md-4 brand-panel p-4 d-flex flex-column justify-content-center">
              <img src="assets/logo.png" alt="" height="48" width="48" class="mb-3 align-self-start">
              <h2 class="h3">Welcome back</h2>
              <p class="mb-3">Sign in to borrow books, write reviews and see your loans.</p>
              <ul class="list-unstyled mb-0 small">
                <li class="mb-2">&#10003; Sign in with your e-mail</li>
                <li class="mb-2">&#10003; Borrow or reserve books</li>
                <li class="mb-2">&#10003; See what you have read</li>
              </ul>
            </div>

            <div class="col-md-8">
              <form id="loginForm" class="p-4" novalidate>
                <h1 class="h3 mb-3">Sign in</h1>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email" aria-describedby="formError">
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" id="password" class="form-control" autocomplete="current-password" aria-describedby="formError">
                </div>

                <div id="formError" class="alert alert-danger d-none" role="alert"></div>

                <button type="submit" class="btn btn-danger px-4">Sign in</button>
                <p class="mt-3 mb-0">New here? <a href="register.html" class="text-danger">Create account</a></p>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/login.js"></script>
</body>
</html>
