<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Book Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="site-header">
  <div class="container header-bar">
    <a href="index.html" class="brand">Book Catalog</a>
    <div id="account" class="account"></div>
  </div>
</header>

<nav class="site-nav" aria-label="Main">
  <div class="container nav-bar">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <form action="catalog.html" method="get" class="nav-search" role="search">
      <input type="search" name="q" class="form-control form-control-sm" placeholder="Search by title or author" aria-label="Search books">
    </form>
  </div>
</nav>

<div id="alertArea" class="alert-area" aria-live="polite"></div>

<main class="container flex-grow-1">

  <section class="form-page">
    <p class="eyebrow">Welcome back</p>
    <h1 class="mb-4">Sign in</h1>

    <form id="loginForm" novalidate onsubmit="loginUser(); return false;">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email">
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" autocomplete="current-password">
      </div>

      <div id="formError" class="alert alert-primary d-none" role="alert"></div>

      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>

    <p class="mt-4 text-muted-ink">New here? <a href="register.html">Create an account</a></p>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-bar">
    <div>
      <p class="brand mb-1">Book Catalog</p>
      <p class="text-muted-ink mb-0">Discover, borrow and read your favorite books.</p>
      <p class="small text-muted-ink mt-3 mb-0">Created by Bauyrzhan Tamerlan</p>
    </div>
    <div>
      <p class="mb-1"><a href="catalog.html">Browse the catalog</a></p>
      <p class="mb-0"><a href="about.html">About &amp; contact</a></p>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/login.js"></script>
</body>
</html>
