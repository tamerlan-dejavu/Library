<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" data-page="catalog">

<div id="siteHeader"></div>

<div class="catalog-layout flex-grow-1">

  <aside class="catalog-filters bg-secondary-subtle p-4" aria-labelledby="filtersTitle">
    <h2 id="filtersTitle">Filters</h2>

    <!-- method="get" writes the filters into the address bar -->
    <form id="filterForm" action="catalog.html" method="get">
      <input type="hidden" name="q" id="filterQ">

      <fieldset class="mb-3">
        <legend class="fs-6 fw-bold">Genre</legend>
        <div id="genreList"><p class="mb-0">Loading...</p></div>
      </fieldset>

      <fieldset class="mb-3">
        <legend class="fs-6 fw-bold">Year</legend>
        <div class="d-flex justify-content-between small"><span id="yearMin"></span><span id="yearMax"></span></div>
        <div class="d-flex gap-2 mt-1">
          <label for="yearFrom" class="visually-hidden">Year from</label>
          <input type="number" id="yearFrom" name="year_from" class="form-control form-control-sm" placeholder="From">
          <label for="yearTo" class="visually-hidden">Year to</label>
          <input type="number" id="yearTo" name="year_to" class="form-control form-control-sm" placeholder="To">
        </div>
      </fieldset>

      <fieldset class="mb-3">
        <legend class="fs-6 fw-bold">Rating</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="" id="ratingAny">
            <label class="form-check-label" for="ratingAny">Any rating</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="5" id="rating5">
            <label class="form-check-label" for="rating5">5 stars</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="4" id="rating4">
            <label class="form-check-label" for="rating4">4 stars & up</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="3" id="rating3">
            <label class="form-check-label" for="rating3">3 stars & up</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="2" id="rating2">
            <label class="form-check-label" for="rating2">2 stars & up</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="rating" value="1" id="rating1">
            <label class="form-check-label" for="rating1">1 star & up</label>
          </div>
      </fieldset>

      <button type="submit" class="btn btn-danger">Apply</button>
      <a href="catalog.html" class="text-danger ms-2">Reset</a>
    </form>
  </aside>

  <main class="catalog-results p-4">
    <h1 class="mb-3">Catalog</h1>
    <p id="searchInfo" class="mb-3 d-none"></p>

    <div id="bookGrid" class="book-grid">
      <p>Loading...</p>
    </div>

    <div id="emptyMessage" class="d-none">
      <p class="mb-1">No books found</p>
      <a href="catalog.html" class="text-danger">Reset</a>
    </div>

    <nav aria-label="Pagination" class="mt-4">
      <ul id="pager" class="pagination"></ul>
    </nav>
  </main>

</div>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/books.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
